function stopLive(){liveActive=false;liveEpoch++;cancelAnimationFrame(liveFrame);if(liveRecorder?.state==='recording')liveRecorder.stop();liveStream?.getTracks().forEach(t=>t.stop());liveStream=null;liveContext?.close().catch(()=>{});liveContext=null;$('audio').pause();liveButton.textContent='◉ Avvia LIVE';$('mic').disabled=false;status('LIVE terminata');}
function listenLive(epoch){if(!liveActive||epoch!==liveEpoch)return;const analyser=liveContext.createAnalyser();analyser.fftSize=1024;const source=liveContext.createMediaStreamSource(liveStream);source.connect(analyser);const samples=new Float32Array(analyser.fftSize);let parts=[],heard=false,last=0,start=performance.now();const recorder=new MediaRecorder(liveStream);liveRecorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};recorder.onstop=async()=>{cancelAnimationFrame(liveFrame);source.disconnect();if(!liveActive||epoch!==liveEpoch)return;if(!heard){listenLive(epoch);return;}try{status('LIVE · Trascrizione…');const type=recorder.mimeType||'audio/mp4';const f=new FormData();f.append('file',new Blob(parts,{type}),type.includes('webm')?'audio.webm':'audio.mp4');const d=await api('/transcribe',f);if(!liveActive||epoch!==liveEpoch)return;if(!d.text?.trim()){listenLive(epoch);return;}const count=history.length;$('message').value=d.text;await $('chatForm').onsubmit({preventDefault(){}});if(!liveActive||epoch!==liveEpoch)return;if(history.length>count){status('LIVE · ALTER parla');await speak();const audio=$('audio');if(audio.paused&&!audio.ended){status('LIVE · Premi Play per ascoltare');}if(!audio.ended)await new Promise(resolve=>{const done=()=>{audio.removeEventListener('ended',done);audio.removeEventListener('error',done);audio.removeEventListener('pause',done);resolve()};audio.addEventListener('ended',done);audio.addEventListener('error',done);audio.addEventListener('pause',done);});}if(liveActive&&epoch===liveEpoch)listenLive(epoch);}catch(e){stopLive();status('LIVE: '+e.message);}};recorder.start();status('LIVE · Ti ascolto');function tick(t){if(!liveActive||epoch!==liveEpoch)return;analyser.getFloatTimeDomainData(samples);const rms=Math.sqrt(samples.reduce((a,b)=>a+b*b,0)/samples.length);if(rms>0.025){heard=true;last=t;}if((heard&&t-last>1200)||t-start>30000){if(recorder.state==='recording')recorder.stop();return;}liveFrame=requestAnimationFrame(tick);}liveFrame=requestAnimationFrame(tick);}
liveButton.onclick=async()=>{if(liveActive){stopLive();return;}if(busy||rec?.state==='recording'){status('Termina la registrazione o attendi la risposta');return;}try{liveActive=true;const epoch=++liveEpoch;liveButton.textContent='■ Termina LIVE';$('mic').disabled=true;liveContext=new (window.AudioContext||window.webkitAudioContext)();await liveContext.resume();const input=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});if(!liveActive||epoch!==liveEpoch){input.getTracks().forEach(t=>t.stop());return;}liveStream=input;listenLive(epoch);}catch(e){stopLive();status('LIVE: '+e.message);}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&liveActive)stopLive()});

const cyberObserver=new MutationObserver(()=>{document.body.dataset.live=String(liveActive)});cyberObserver.observe(liveButton,{childList:true,subtree:true});$('audio').addEventListener('playing',()=>document.body.dataset.speaking='true');for(const ev of ['pause','ended','error'])$('audio').addEventListener(ev,()=>document.body.dataset.speaking='false');

$('webSearch').onclick=run(async()=>{if(busy)return;const message=$('message').value.trim();if(!message){status('Scrivi cosa vuoi cercare sul web');$('message').focus();return;}busy=true;try{status('Ricerca web…');const d=await api('/web-search',{message});if(d.web!==true)throw Error('Ricerca web non attiva: aggiorna il Worker');history.push({role:'user',content:message},{role:'assistant',content:d.reply});save('history',history);$('message').value='';render();status('Ricerca completata');if($('autoVoice').checked)await speak();}finally{busy=false;}});
</script></html>
