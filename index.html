<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101426"><title>ALTER 1.2</title><style>*{box-sizing:border-box}body{margin:0;background:#101426;color:#eef2ff;font:17px system-ui}main{max-width:700px;margin:auto;padding:20px}section{background:#1c2540;border:1px solid #354365;border-radius:22px;padding:16px;margin:16px 0}input,textarea,button{font:inherit;border-radius:12px;padding:12px}input,textarea{width:100%;background:#11182b;color:white;border:1px solid #536181;margin:6px 0}button{background:#5759df;color:white;border:0;margin:4px 0;cursor:pointer}button:disabled{opacity:.5}#chat{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.msg{background:#303e63;padding:12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.me{background:#5054cf;align-self:flex-end}small{color:#b9c4df}li{margin:10px 0;overflow-wrap:anywhere}li button{font-size:13px;margin-left:8px}h1{margin-bottom:4px}</style></head><body><main><h1>✦ ALTER 1.2</h1><small>Assistente personale AI</small><section><label for="token">Token privato ALTER</label><input id="token" type="password" autocomplete="off" placeholder="ALTER_TEST_TOKEN"><button id="saveToken">Attiva per questa sessione</button><small id="status" role="status"></small></section><section><div id="chat" aria-live="polite"></div><form id="chatForm"><input id="message" placeholder="Scrivi ad ALTER…" required maxlength="2000"><button id="send">Invia</button></form></section><section><h2>Ricordi e scadenze</h2><form id="memoryForm"><textarea id="memory" required placeholder="Cosa vuoi ricordare?"></textarea><label for="date">Scadenza (facoltativa)</label><input id="date" type="date"><button>Salva nella memoria</button></form><ul id="memories"></ul><small>Memoria locale su questo browser. Le scadenze sono consultabili qui, senza notifiche automatiche.</small></section></main><script>
const API='https://alter-ai-12.9ywy5vvp99.workers.dev';const $=id=>document.getElementById(id);let token='',history=[],memories=[];const key='alter12_memories';try{memories=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(memories))memories=[]}catch{memories=[]}function bubble(t,me=false){const d=document.createElement('div');d.className='msg'+(me?' me':'');d.textContent=t;$('chat').append(d);$('chat').scrollTop=$('chat').scrollHeight}function persist(){try{localStorage.setItem(key,JSON.stringify(memories));return true}catch{alert('Memoria locale non disponibile');return false}}function render(){ $('memories').replaceChildren();memories.forEach((m,i)=>{const li=document.createElement('li');li.textContent=m.text+(m.date?' — '+m.date:'');const b=document.createElement('button');b.textContent='Elimina';b.onclick=()=>{if(confirm('Eliminare questo ricordo?')){memories.splice(i,1);persist();render()}};li.append(b);$('memories').append(li)})}render();bubble('Ciao! Sono ALTER. Inserisci il token privato per parlare con me.');$('saveToken').onclick=()=>{token=$('token').value.trim();$('token').value='';$('status').textContent=token?'Token impostato. Invia un messaggio per verificare.':'Inserisci il token.'};$('memoryForm').onsubmit=e=>{e.preventDefault();const t=$('memory').value.trim();if(!t)return;memories.push({text:t,date:$('date').value});persist();render();$('memory').value='';$('date').value=''};$('chatForm').onsubmit=async e=>{e.preventDefault();const msg=$('message').value.trim();if(!msg)return;if(!token){$('status').textContent='Inserisci prima il token privato.';return}bubble(msg,true);$('message').value='';$('send').disabled=true;try{const context=history.slice(-6).map(x=>x.role+': '+x.text).join('\n');const prompt=(context?'Conversazione precedente:\n'+context.slice(-650)+'\n':'')+'Utente: '+msg;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({message:prompt.length<=2000?prompt:msg}),signal:AbortSignal.timeout(35000)});const data=await r.json();if(!r.ok)throw Error((data.error||'Errore HTTP')+' ('+(data.code||r.status)+')');if(typeof data.reply!=='string')throw Error('Risposta non valida');bubble(data.reply);history.push({role:'Utente',text:msg},{role:'ALTER',text:data.reply});$('status').textContent='AI collegata'}catch(err){bubble('Errore: '+err.message);$('status').textContent='Connessione AI non confermata'}finally{$('send').disabled=false}};
</script></body></html>
