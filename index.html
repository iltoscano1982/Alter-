const $=id=>document.getElementById(id), base='https://alter-ai-12.9ywy5vvp99.workers.dev';const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('alter2:'+k))??d}catch{return d}};const save=(k,v)=>localStorage.setItem('alter2:'+k,JSON.stringify(v));let history=read('history',[]),notes=read('notes',[]),reminders=read('reminders',[]),token=read('token',''),busy=false,rec,stream,chunks=[];const status=t=>$('status').textContent=t;const run=fn=>async()=>{try{await fn()}catch(e){status(e.message)}};async function api(path,body,raw=false){if(!token)throw Error('Inserisci il token nelle impostazioni');const form=body instanceof FormData;const r=await fetch(base+path,{method:'POST',headers:{Authorization:'Bearer '+token,...(form?{}:{'Content-Type':'application/json'})},body:form?body:JSON.stringify(body)});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error((d.error||'Errore server')+(d.code?' '+d.code:''));}return raw?r.blob():r.json();}function render(){ $('chat').replaceChildren();for(const m of history){const d=document.createElement('div');d.className='msg '+m.role;d.textContent=(m.role==='user'?'Tu: ':'ALTER: ')+m.content;$('chat').append(d)}$('chat').scrollTop=$('chat').scrollHeight;list('notes',notes.filter(n=>n.text.toLowerCase().includes($('search').value.toLowerCase())),async n=>{notes=notes.filter(x=>x.id!==n.id);save('notes',notes);render()});list('reminders',reminders,async n=>{if(n.push)await api('/push/delete',{id:n.id});reminders=reminders.filter(x=>x.id!==n.id);save('reminders',reminders);render()});}function list(id,items,del){$(id).replaceChildren();for(const n of items){const d=document.createElement('div');d.textContent=n.text+(n.at?' — '+new Date(n.at).toLocaleString('it-IT')+(n.push?' · push':' · locale'):'');const b=document.createElement('button');b.textContent='Elimina';b.onclick=run(()=>del(n));d.append(' ',b);$(id).append(d)}}$('token').value=token;$('saveToken').onclick=()=>{token=$('token').value.trim();save('token',token);status('Token salvato')};$('search').oninput=render;$('addNote').onclick=()=>{if(!$('note').value.trim())return;notes.push({id:crypto.randomUUID(),text:$('note').value.trim()});save('notes',notes);$('note').value='';render()};async function speak(){const m=history.filter(x=>x.role==='assistant').at(-1);if(!m)return;const blob=await api('/speech',{text:m.content},true);const a=$('audio');if(a.src.startsWith('blob:'))URL.revokeObjectURL(a.src);a.src=URL.createObjectURL(blob);a.hidden=false;try{await a.play()}catch{status('Premi Play per ascoltare')}}$('play').onclick=run(speak);$('chatForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const message=$('message').value.trim();if(!message)return;busy=true;status('ALTER sta pensando…');try{const d=await api('/chat',{message,history,memory:notes.map(n=>n.text).join('\n')+'\nScadenze: '+reminders.map(n=>n.text+' '+new Date(n.at).toLocaleString()).join('\n')});history.push({role:'user',content:message},{role:'assistant',content:d.reply});save('history',history);$('message').value='';render();status('Pronto');if($('autoVoice').checked)await speak()}catch(e){status(e.message)}finally{busy=false}};$('mic').onclick=run(async()=>{if(rec?.state==='recording'){rec.stop();return}stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('mic').textContent='🎙 Registra';try{const type=rec.mimeType||'audio/mp4';const f=new FormData();f.append('file',new Blob(chunks,{type}),type.includes('webm')?'audio.webm':'audio.mp4');status('Trascrizione…');const d=await api('/transcribe',f);$('message').value=d.text||'';status('Controlla e invia il messaggio')}catch(e){status(e.message)}};rec.start();$('mic').textContent='⏹ Ferma';status('Registrazione in corso')});let registration;async function reg(){if(!('serviceWorker'in navigator))throw Error('Service worker non disponibile');return registration||(registration=await navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready))}const decode=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));$('enablePush').onclick=run(async()=>{if(!('Notification'in window))throw Error('Installa ALTER sulla Home e riaprilo');if(await Notification.requestPermission()!=='granted')throw Error('Permesso notifiche negato');const r=await reg(),k=await api('/push/key',{});let sub=await r.pushManager.getSubscription();if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decode(k.key)});await api('/push/subscribe',{subscription:sub.toJSON()});for(const n of reminders.filter(n=>n.at>Date.now())){await api('/push/reminder',n);n.push=true}save('reminders',reminders);save('push',true);render();status('Notifiche attivate')});$('testPush').onclick=run(async()=>{await api('/push/test',{});status('Notifica inviata al servizio push')});$('addRem').onclick=run(async()=>{const text=$('remText').value.trim(),at=new Date($('remDate').value).getTime();if(!text||!Number.isFinite(at)||at<=Date.now())throw Error('Inserisci un impegno e una data futura');const n={id:crypto.randomUUID(),text,at,push:false};reminders.push(n);save('reminders',reminders);render();if(read('push',false)){await api('/push/reminder',n);n.push=true;save('reminders',reminders);render()}status('Promemoria salvato')});setInterval(()=>{for(const n of reminders){if(!n.alerted&&n.at<=Date.now()){n.alerted=true;status('Promemoria: '+n.text);save('reminders',reminders)}}},15000);$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({history,notes,reminders},null,2)],{type:'application/json'}));a.download='alter-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=run(async()=>{const d=JSON.parse(await $('import').files[0].text());if(!Array.isArray(d.history)||!Array.
